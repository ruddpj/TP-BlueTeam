# Input
input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics            => ["logs-app"]
    codec             => "json"
    group_id          => "logstash-consumer-group"
    auto_offset_reset => "earliest"
  }
}

# Filter
filter {
  # 1. Parse raw text into fields
  if [message] {
    dissect {
      mapping => {
        "message" => "%{log_timestamp} %{log_level} %{service_name} %{log_message}"
      }
      ignore_failure => true
    }
  }

  # 2. Normalize timestamp to ISO8601 UTC
  if [log_timestamp] {
    date {
      match        => [ "log_timestamp", "ISO8601", "yyyy-MM-dd'T'HH:mm:ssZ" ]
      target       => "@timestamp"
      remove_field => [ "log_timestamp" ]
    }
  }

  # 3. Map fields to Elastic Common Schema (ECS 8.x)
  mutate {
    rename    => { "log_level"    => "[log][level]" }
    rename    => { "service_name" => "[service][name]" }
    rename    => { "log_message"  => "[message]" }
    lowercase => [ "[log][level]" ]
    add_field => { "[ecs][version]" => "8.11.0" }
  }

  # 4. Enrich IP addresses with GeoIP metadata
  if [client][ip] {
    geoip {
      source => "[client][ip]"
      target => "[source][geo]"
    }
  }

  mutate {
    add_tag => [ "pipeline_logstash_processed" ]
  }
}

# Output
output {
  stdout {
    codec => rubydebug { metadata => false }
  }

  # elasticsearch {
