# Input
input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics            => ["logs-app"]
    codec             => "json"
    group_id          => "logstash-consumer-group"
    auto_offset_reset => "earliest"
  }
}

# Filter
filter {
  # 1. Parse raw text into fields
  if [message] and ![app] {
    dissect {
      mapping => {
        "message" => "%{log_timestamp} %{log_level} %{service_name} %{log_message}"
      }
      tag_on_failure => [ "_dissect_skipped" ]
    }
  }

  # 2. Normalize timestamp to ISO8601 UTC
  if [log_timestamp] {
    date {
      match        => [ "log_timestamp", "ISO8601", "yyyy-MM-dd'T'HH:mm:ssZ" ]
      target       => "@timestamp"
      remove_field => [ "log_timestamp" ]
    }
  }

  # 3. Map fields to Elastic Common Schema (ECS 8.x)
  mutate {
    rename    => { "log_level"    => "[log][level]" }
    rename    => { "service_name" => "[service][name]" }
    rename    => { "log_message"  => "[message]" }
    add_field => { "[ecs][version]" => "8.11.0" }
  }

  # 4. Promote decoded ECS fields from Filebeat's app namespace when needed
  ruby {
    init => '
      @ecs_fields = {
        "[event][category]" => "[app][event][category]",
        "[event][outcome]" => "[app][event][outcome]",
        "[event][code]" => "[app][event][code]",
        "[source][ip]" => "[app][source][ip]",
        "[destination][ip]" => "[app][destination][ip]",
        "[client][ip]" => "[app][client][ip]",
        "[process][name]" => "[app][process][name]",
        "[process][parent][name]" => "[app][process][parent][name]",
        "[log][level]" => "[app][log][level]",
        "[url][path]" => "[app][url][path]"
      }.freeze
    '
    code => '
      @ecs_fields.each do |target, source|
        value = event.get(source)
        if value && event.get(target).nil?
          event.set(target, value)
          event.remove(source)
        end
      end

      app_level = event.get("[app][level]")
      if app_level && event.get("[log][level]").nil?
        event.set("[log][level]", app_level)
        event.remove("[app][level]")
      end
    '
  }

  mutate {
    lowercase => [ "[log][level]" ]
  }

  if [log][level] == "debug" or [app][level] == "debug" or [app][log][level] == "debug" or [url][path] in ["/healthz", "/metrics"] {
    drop { }
  }

  # 5. Enrich IP addresses with GeoIP metadata
  if [client][ip] {
    geoip {
      source => "[client][ip]"
      target => "[source][geo]"
    }
  } else if [source][ip] {
    geoip {
      source => "[source][ip]"
      target => "[source][geo]"
    }
  }

  # 6. Match ECS IP fields against the locally maintained threat-intel dictionary
  translate {
    source           => "[source][ip]"
    target           => "[@metadata][threat_intel][source_ip]"
    dictionary_path  => "/usr/share/logstash/config/threat-intel/threat-intel.yml"
    fallback         => "not_found"
    exact            => true
  }

  translate {
    source           => "[destination][ip]"
    target           => "[@metadata][threat_intel][destination_ip]"
    dictionary_path  => "/usr/share/logstash/config/threat-intel/threat-intel.yml"
    fallback         => "not_found"
    exact            => true
  }

  translate {
    source           => "[client][ip]"
    target           => "[@metadata][threat_intel][client_ip]"
    dictionary_path  => "/usr/share/logstash/config/threat-intel/threat-intel.yml"
    fallback         => "not_found"
    exact            => true
  }

  # 7. Score structured security signals
  ruby {
    path => "/usr/share/logstash/scripts/risk_scorer.rb"
  }

  mutate {
    add_tag => [ "pipeline_logstash_processed" ]
  }
}

# Output
output {
  # stdout {
  #   codec => rubydebug { metadata => false }
  # }

  elasticsearch {
    hosts                 => ["http://elasticsearch:9200"]
    data_stream           => true
    data_stream_type      => "logs"
    data_stream_dataset   => "app"
    data_stream_namespace => "default"
  }
}
