version: '3.8'

networks:
  ingestion-net:
    driver: bridge

volumes:
  elasticsearch-data:

services:
  threat-intel-updater:
    image: python:3.12-alpine
    command:
      - /bin/sh
      - -c
      - |
        THREAT_INTEL_OUTPUT_PATH=/data/threat-intel.yml \
          /usr/local/bin/python /usr/local/bin/pull_threat.py ||
          echo "Initial threat-intel update failed; scheduled retries remain active."
        exec crond -f -d 2 -c /etc/crontabs
    volumes:
      - ./scripts/pull_threat.py:/usr/local/bin/pull_threat.py:ro,z
      - ./scripts/pull_threat.cron:/etc/crontabs/root:ro,z
      - ./threat-intel:/data:rw,z
    restart: unless-stopped
    networks:
      - ingestion-net

  kafka:
    image: docker.io/apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    networks:
      - ingestion-net

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    user: root
    entrypoint: ["filebeat", "-e", "-strict.perms=false"]
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro,z
      - /tmp/test-logs:/var/log/app:ro,z
    depends_on:
      - kafka
    networks:
      - ingestion-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - ingestion-net

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    environment:
      RISK_SCORE_THRESHOLD: ${RISK_SCORE_THRESHOLD:-70}
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro,z
      - ./scripts/risk_scorer.rb:/usr/share/logstash/scripts/risk_scorer.rb:ro,z
      - ./threat-intel:/usr/share/logstash/config/threat-intel:ro,z
    depends_on:
      - kafka
      - elasticsearch
      - threat-intel-updater
    networks:
      - ingestion-net
