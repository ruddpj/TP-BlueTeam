version: '3.8'

networks:
  ingestion-net:
    driver: bridge

volumes:
  elasticsearch-data:

services:
  threat-intel-updater:
    image: python:3.12-alpine
    command:
      - /bin/sh
      - -c
      - |
        THREAT_INTEL_OUTPUT_PATH=/data/threat-intel.yml \
          /usr/local/bin/python /usr/local/bin/pull_threat.py ||
          echo "Initial threat-intel update failed; scheduled retries remain active."
        exec crond -f -d 2 -c /etc/crontabs
    volumes:
      - ./scripts/pull_threat.py:/usr/local/bin/pull_threat.py:ro,z
      - ./scripts/pull_threat.cron:/etc/crontabs/root:ro,z
      - ./threat-intel:/data:rw,z
    restart: unless-stopped
    networks:
      - ingestion-net

  kafka:
    image: docker.io/apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    networks:
      - ingestion-net

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    user: root
    entrypoint: ["filebeat", "-e", "-strict.perms=false"]
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro,z
      - /tmp/test-logs:/var/log/app:ro,z
    depends_on:
      - kafka
    networks:
      - ingestion-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - ingestion-net

  elasticsearch-template-setup:
    image: python:3.12-alpine
    command: ["python", "/app/setup_es_template.py"]
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
    volumes:
      - ./scripts/setup_es_template.py:/app/setup_es_template.py:ro,z
    depends_on:
      - elasticsearch
    restart: on-failure
    networks:
      - ingestion-net

  agent:
    build:
      context: ./agent
    environment:
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      ELASTICSEARCH_API_KEY: ${ELASTICSEARCH_API_KEY:-}
      RISK_SCORE_THRESHOLD: ${RISK_SCORE_THRESHOLD:-70}
      ALERT_LOOKBACK_MINUTES: ${ALERT_LOOKBACK_MINUTES:-60}
      AGENT_WEBHOOK_TOKEN: ${AGENT_WEBHOOK_TOKEN:?Set AGENT_WEBHOOK_TOKEN in your environment}
    ports:
      - "${AGENT_PORT:-8000}:8000"
    depends_on:
      elasticsearch-template-setup:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - ingestion-net

  kibana-alert-setup:
    image: python:3.12-alpine
    command: ["python", "/app/setup_alerting.py"]
    environment:
      KIBANA_URL: ${KIBANA_URL:?Set KIBANA_URL to your existing Kibana URL}
      KIBANA_USERNAME: ${KIBANA_USERNAME:-}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD:-}
      KIBANA_API_KEY: ${KIBANA_API_KEY:-}
      AGENT_WEBHOOK_URL: ${AGENT_WEBHOOK_URL:?Set AGENT_WEBHOOK_URL to an address reachable from the Kibana container}
      AGENT_WEBHOOK_TOKEN: ${AGENT_WEBHOOK_TOKEN:?Set AGENT_WEBHOOK_TOKEN in your environment}
      RISK_SCORE_THRESHOLD: ${RISK_SCORE_THRESHOLD:-70}
      ALERT_LOOKBACK_MINUTES: ${ALERT_LOOKBACK_MINUTES:-60}
    volumes:
      - ./kibana/setup_alerting.py:/app/setup_alerting.py:ro,z
    depends_on:
      - agent
    restart: on-failure
    networks:
      - ingestion-net

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    environment:
      RISK_SCORE_THRESHOLD: ${RISK_SCORE_THRESHOLD:-70}
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro,z
      - ./scripts/risk_scorer.rb:/usr/share/logstash/scripts/risk_scorer.rb:ro,z
      - ./threat-intel:/usr/share/logstash/config/threat-intel:ro,z
    depends_on:
      kafka:
        condition: service_started
      elasticsearch:
        condition: service_started
      threat-intel-updater:
        condition: service_started
      elasticsearch-template-setup:
        condition: service_completed_successfully
    networks:
      - ingestion-net
